<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}打分规则管理{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --line: #e5e7eb;
      --line-strong: #d5d9e0;
      --ink: #111827;
      --ink-2: #374151;
      --muted: #6b7280;
      --brand: #2563eb;
      --brand-weak: #eff4ff;
      --ok: #047857;
      --ok-weak: #ecfdf5;
      --warn: #b45309;
      --warn-weak: #fffbeb;
      --danger: #b91c1c;
      --danger-weak: #fef2f2;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 16px rgba(16, 24, 40, .05);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* 顶栏 */
    header.top {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px 24px;
      background: rgba(255, 255, 255, .88);
      backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid var(--line);
    }
    header.top .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 650; letter-spacing: .2px; }
    header.top .brand:hover { text-decoration: none; }
    header.top .dot { width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(135deg, #2563eb, #7c3aed); }
    header.top .op { color: var(--muted); font-size: 12px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }

    main { max-width: 1560px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 20px; font-weight: 650; margin: 0 0 6px; letter-spacing: .2px; }
    h2 { font-size: 13px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin: 28px 0 10px; }
    .hint { color: var(--muted); font-size: 12px; }
    p.lead { margin: 0 0 16px; color: var(--muted); font-size: 13px; max-width: 1000px; }

    /* 卡片 */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card + .card { margin-top: 16px; }
    .card-body { padding: 16px 18px; }

    /* 统计条 */
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 18px; }
    .stat { flex: 1 1 150px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
    .stat b { display: block; font-size: 20px; font-weight: 650; line-height: 1.2; }
    .stat span { font-size: 12px; color: var(--muted); }

    /* 表格 */
    .table-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; background: var(--surface); box-shadow: var(--shadow); max-height: calc(100vh - 260px); }
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    thead th {
      position: sticky; top: 0; z-index: 2;
      background: #f9fafb; color: var(--ink-2);
      font-size: 12px; font-weight: 650; text-align: left; white-space: nowrap;
      padding: 9px 12px; border-bottom: 1px solid var(--line-strong);
    }
    tbody td { padding: 6px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #fbfcfe; }
    tbody tr.is-clickable { cursor: pointer; }
    tr.row-draft td { background: var(--warn-weak); }
    tr.row-draft:hover td { background: #fff7e6; }
    tr.row-active td { background: #fafcff; }
    td.idx { width: 42px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
    td.op { width: 44px; text-align: center; }
    td.num { font-variant-numeric: tabular-nums; }

    /* 表单控件 */
    input, textarea {
      width: 100%; font: inherit; color: inherit;
      padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; background: transparent;
      transition: border-color .12s, background .12s, box-shadow .12s;
    }
    input:hover:not(:disabled), textarea:hover:not(:disabled) { border-color: var(--line-strong); background: #fff; }
    input:focus, textarea:focus { outline: none; border-color: var(--brand); background: #fff; box-shadow: 0 0 0 3px var(--brand-weak); }
    input:disabled { color: var(--ink-2); -webkit-text-fill-color: var(--ink-2); opacity: 1; }
    input.num, input.score { text-align: center; font-variant-numeric: tabular-nums; }
    input.score { font-weight: 600; }
    input.note::placeholder { color: #b6bcc7; }
    textarea.text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.75; border: 1px solid var(--line); background: #fff; padding: 12px 14px; min-height: 320px; }
    .field { display: flex; align-items: center; gap: 10px; }
    .field > label { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
    .field input { border-color: var(--line); background: #fff; }

    /* 按钮 */
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0; }
    .actions form { display: inline; }
    button, a.btn {
      display: inline-flex; align-items: center; gap: 6px;
      font: inherit; font-weight: 500; line-height: 1.2;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none;
      border: 1px solid var(--line-strong); background: #fff; color: var(--ink-2);
      transition: background .12s, border-color .12s, color .12s, box-shadow .12s;
      white-space: nowrap;
    }
    button:hover, a.btn:hover { border-color: var(--brand); color: var(--brand); text-decoration: none; }
    button:active, a.btn:active { transform: translateY(.5px); }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 1px 2px rgba(37, 99, 235, .28); }
    button.primary:hover { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    button.danger { color: var(--danger); border-color: #f3c9c9; background: #fff; }
    button.danger:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
    button.del { padding: 2px 8px; border: 1px solid transparent; background: transparent; color: #c3c8d1; font-size: 15px; border-radius: 6px; }
    button.del:hover { color: var(--danger); background: var(--danger-weak); border-color: #f3c9c9; }

    /* 徽标 / 标签 */
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 12px; color: var(--muted); }
    .chip b { color: var(--ink); font-weight: 600; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .badge.ok { color: var(--ok); background: var(--ok-weak); border: 1px solid #bbe7d6; }
    .badge.draft { color: var(--warn); background: var(--warn-weak); border: 1px solid #f6dfae; }
    .badge.muted { color: var(--muted); background: #f3f4f6; border: 1px solid var(--line); }
    .badge.archived { color: #4b5563; background: #f3f4f6; border: 1px solid var(--line); }

    /* 提示条 */
    .notice { display: flex; gap: 10px; padding: 12px 14px; margin: 12px 0 16px; border-radius: var(--radius); border: 1px solid #dbe4f5; background: var(--brand-weak); color: #1e3a8a; font-size: 13px; }
    .err { display: flex; gap: 10px; padding: 12px 14px; margin: 12px 0 16px; border-radius: var(--radius); border: 1px solid #f6c9c9; background: var(--danger-weak); color: var(--danger); font-size: 13px; }
    .notice .ico, .err .ico { font-weight: 700; }

    /* 吸底操作条 */
    .toolbar {
      position: sticky; bottom: 0; z-index: 20;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-top: 14px; padding: 12px 16px;
      background: rgba(255, 255, 255, .94); backdrop-filter: blur(8px);
      border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .toolbar .spacer { flex: 1; }

    pre.preview { background: #0f172a; color: #e2e8f0; padding: 16px 18px; border-radius: var(--radius); overflow: auto; font-size: 12px; line-height: 1.75; max-height: 520px; margin: 0; }
    .preview-head { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 10px; }
    .preview-head h2 { margin: 0; }

    .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; }
    .search { max-width: 280px; }
    .filter { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter button { padding: 6px 12px; font-size: 13px; }
    .filter button.on { border-color: var(--brand); color: var(--brand); background: var(--brand-weak); }
    .row-flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
    @media (max-width: 720px) {
      main { padding: 16px; }
      .stat { flex: 1 1 120px; }
      .table-wrap { max-height: none; }
    }
  </style>
</head>
<body>
<header class="top">
  <a class="brand" href="/admin/rules"><span class="dot"></span>打分规则管理</a>
  <span class="op">{{ operator }}</span>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
